<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Ezra Ehoche</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;900&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root{ --paper:#F0EEE6; --ink:#14161F; --ink-soft:#4C4F5C; --cobalt:#2438D6; --tangerine:#E8631A; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Archivo',system-ui,sans-serif;background:var(--paper);color:var(--ink);
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;
  }
  .code{font-family:'IBM Plex Mono',monospace;font-size:.85rem;letter-spacing:.14em;color:var(--tangerine)}
  h1{font-weight:900;letter-spacing:-.03em;font-size:clamp(2.2rem,8vw,4rem);margin:12px 0 10px}
  p{color:var(--ink-soft);max-width:44ch;margin:0 auto 28px}
  a.btn{
    display:inline-block;text-decoration:none;font-weight:700;font-size:.92rem;
    padding:13px 26px;border:2px solid var(--ink);border-radius:4px;background:var(--ink);color:var(--paper);
  }
  a.btn:hover{background:var(--cobalt);border-color:var(--cobalt)}
</style>
</head>
<body>
<div>
  <div class="code">404 — NOT FOUND</div>
  <h1>This page doesn't exist.</h1>
  <p>The link may be mistyped or the page has moved. The home page has everything that does exist.</p>
  <a class="btn" href="/">Back home</a>
</div>
</body>
</html>
